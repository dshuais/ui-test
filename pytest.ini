[pytest]
# pytest 全局配置

# 测试文件搜索路径
testpaths = cases

# 文件匹配模式
python_files = test_*.py

# 类匹配模式
python_classes = Test*

# 方法匹配模式
python_functions = test_*

# 命令行参数（默认追加）
addopts =
    -v
    -s
    --tb=short
    --strict-markers
    --disable-warnings

# 自定义标记
markers =
    smoke: 冒烟测试用例
    regression: 回归测试用例
    slow: 执行较慢的用例

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-5s | %(message)s
log_cli_date_format = %H:%M:%S
